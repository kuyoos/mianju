name: Build Zygisk Module

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build all (single step, full log to file)
        run: |
          exec > >(tee -a build.log) 2>&1
          set -x
          echo "### ENV ###"
          env | sort | grep -iE 'android|ndk|sdk|java' || true
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"

          echo "### SDK LAYOUT ###"
          ls "$SDK" || true
          ls "$SDK/cmdline-tools" || true
          ls "$SDK/ndk" 2>/dev/null || echo "no ndk yet"

          NDK_VER=26.1.10909125
          if [ ! -d "$SDK/ndk/$NDK_VER" ]; then
            echo "### INSTALL NDK ###"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VER" || true
          fi
          export ANDROID_NDK_HOME="$SDK/ndk/$NDK_VER"
          echo "NDK=$ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME" | head || true

          echo "### CMAKE CONFIGURE ###"
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_STL=c++_static || echo "CONFIGURE_FAILED=$?"

          echo "### CMAKE BUILD ###"
          cmake --build build -j4 || echo "BUILD_FAILED=$?"

          echo "### ARTIFACTS ###"
          find . -name "*.so" -o -name "CMakeCache.txt" | head -20 || true
          ls -la build/ 2>/dev/null || true

          echo "### PACKAGE ###"
          mkdir -p pkg/lib64
          cp magisk/module.prop pkg/ || echo "CP1_FAIL"
          cp magisk/post-fs-data.sh pkg/ || echo "CP2_FAIL"
          cp magisk/service.sh pkg/ || echo "CP3_FAIL"
          cp build/libzygisk.so pkg/lib64/libzygisk.so || echo "CP4_FAIL"
          find pkg -type f -ls || true

          python3 -c "
          import os, zipfile
          with zipfile.ZipFile('dfzygisk.zip','w',zipfile.ZIP_DEFLATED) as z:
              for root,dirs,files in os.walk('pkg'):
                  for f in files:
                      p=os.path.join(root,f)
                      z.write(p, os.path.relpath(p,'pkg'))
                      print('add', os.path.relpath(p,'pkg'))
          " || echo "ZIP_FAIL=$?"
          ls -la dfzygisk.zip || true

          echo "### DONE ###"

      - name: Upload everything
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build.log
            dfzygisk.zip
            build/libzygisk.so
          if-no-files-found: warn

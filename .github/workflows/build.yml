name: Build Zygisk Module

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK
        run: |
          # GitHub runner 自带 Android SDK，装 NDK
          NDK_VER=26.1.10909125
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VER" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;$NDK_VER" > /dev/null
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
          ls "$ANDROID_HOME/ndk/$NDK_VER" | head -5

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_STL=c++_static

      - name: Build
        run: cmake --build build -j$(nproc) --verbose

      - name: Verify
        run: |
          ls -la build/
          file build/libzygisk.so || true
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -h build/libzygisk.so | head -20

      - name: Package
        run: |
          mkdir -p pkg/lib64
          cp magisk/module.prop pkg/
          cp magisk/post-fs-data.sh pkg/
          cp magisk/service.sh pkg/
          cp build/libzygisk.so pkg/lib64/libzygisk.so
          chmod 755 pkg/post-fs-data.sh pkg/service.sh
          chmod 644 pkg/module.prop pkg/lib64/libzygisk.so
          cd pkg && zip -r ../dfzygisk.zip . && cd ..
          ls -la dfzygisk.zip
          unzip -l dfzygisk.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dfzygisk-module
          path: dfzygisk.zip

name: Build Zygisk Module

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK
        run: |
          set -e
          NDK_VER=26.1.10909125
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "no ndk dir yet"
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VER" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VER"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
          ls "$ANDROID_HOME/ndk/$NDK_VER" | head

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_STL=c++_static

      - name: Build
        run: cmake --build build -j$(nproc) --verbose

      - name: Verify
        run: |
          ls -la build/
          file build/libzygisk.so || true
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -h build/libzygisk.so | head -20

      - name: Package
        run: |
          mkdir -p pkg/lib64
          cp magisk/module.prop pkg/
          cp magisk/post-fs-data.sh pkg/
          cp magisk/service.sh pkg/
          cp build/libzygisk.so pkg/lib64/libzygisk.so
          chmod 755 pkg/post-fs-data.sh pkg/service.sh
          chmod 644 pkg/module.prop pkg/lib64/libzygisk.so
          python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile('dfzygisk.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk('pkg'):
                  for f in files:
                      p = os.path.join(root, f)
                      arc = os.path.relpath(p, 'pkg')
                      z.write(p, arc)
                      print('add', arc)
          PY
          ls -la dfzygisk.zip
          python3 -c "import zipfile; [print(i.filename, i.file_size) for i in zipfile.ZipFile('dfzygisk.zip').infolist()]"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dfzygisk-module
          path: dfzygisk.zip

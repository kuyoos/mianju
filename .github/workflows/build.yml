name: Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch frida-gadget
        run: |
          mkdir -p prebuilt
          curl -L --retry 3 -o /tmp/fg.xz "https://github.com/frida/frida/releases/download/16.7.19/frida-gadget-16.7.19-android-arm64.so.xz"
          xz -dc /tmp/fg.xz > prebuilt/libgadget.so
          ls -la prebuilt/libgadget.so
          file prebuilt/libgadget.so || true

      - name: Compile
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK_VER=26.1.10909125
          if [ ! -d "$SDK/ndk/$NDK_VER" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VER" >/dev/null 2>&1
          fi
          export ANDROID_NDK_HOME="$SDK/ndk/$NDK_VER"
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DCMAKE_BUILD_TYPE=Release > cfg.log 2>&1 || true
          cat cfg.log
          cmake --build build -j4 > bld.log 2>&1 || true
          tail -20 bld.log
          if [ ! -f build/libzygisk.so ]; then
            echo "::error::build failed"; tail -30 bld.log; exit 1
          fi
          ls -la build/libzygisk.so

      - name: Package
        run: |
          set -e
          mkdir -p pkg/lib64 pkg/zygisk
          cp magisk/module.prop magisk/post-fs-data.sh magisk/service.sh pkg/
          cp build/libzygisk.so pkg/lib64/libzygisk.so
          cp build/libzygisk.so pkg/zygisk/arm64-v8a.so
          if [ -f prebuilt/libgadget.so ]; then
            cp prebuilt/libgadget.so pkg/lib64/libgadget.so
            echo "gadget included: $(stat -c %s pkg/lib64/libgadget.so) bytes"
          else
            echo "::warning::prebuilt/libgadget.so missing"
          fi
          cat > pkg/lib64/libgadget.config.so <<'JSON'
          {
            "interaction": {
              "type": "listen",
              "address": "127.0.0.1",
              "port": 27043,
              "on_load": "wait"
            }
          }
          JSON
          python3 -c "
          import os, zipfile
          with zipfile.ZipFile('dfzygisk.zip','w',zipfile.ZIP_DEFLATED) as z:
              for root,d,files in os.walk('pkg'):
                  for f in files:
                      p=os.path.join(root,f)
                      arc=os.path.relpath(p,'pkg')
                      z.write(p, arc)
                      print('add', arc, os.path.getsize(p))
          "
          ls -la dfzygisk.zip

      - name: Publish to dist branch
        run: |
          set -e
          mkdir -p dist
          cp dfzygisk.zip dist/
          cp build/libzygisk.so dist/
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f dist/
          git commit -m "build: $(date -u +%Y%m%d-%H%M%S)" || echo "nothing to commit"
          git push || echo "push failed"

name: Build Zygisk Module

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK
        run: |
          NDK_VER=26.1.10909125
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK" | tee setup.log
          ls "$SDK" 2>&1 | tee -a setup.log
          if [ ! -d "$SDK/ndk/$NDK_VER" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VER" 2>&1 | tail -20 | tee -a setup.log
          fi
          echo "ANDROID_NDK_HOME=$SDK/ndk/$NDK_VER" >> $GITHUB_ENV
          ls "$SDK/ndk/$NDK_VER" 2>&1 | tee -a setup.log
        continue-on-error: false

      - name: Configure
        run: |
          set -x
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_STL=c++_static 2>&1 | tail -40

      - name: Build
        run: |
          set -x
          cmake --build build -j$(nproc) 2>&1 | tail -80
          echo "=== result ==="
          find build -name "*.so" -ls

      - name: Verify
        run: |
          ls -la build/ || true
          file build/libzygisk.so || true
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/libzygisk.so | head -20 || true

      - name: Package
        run: |
          set -euxo pipefail
          mkdir -p pkg/lib64
          cp magisk/module.prop pkg/
          cp magisk/post-fs-data.sh pkg/
          cp magisk/service.sh pkg/
          cp build/libzygisk.so pkg/lib64/libzygisk.so
          chmod 755 pkg/post-fs-data.sh pkg/service.sh
          chmod 644 pkg/module.prop pkg/lib64/libzygisk.so
          echo "--- pkg tree ---"
          find pkg -type f -ls
          python3 -c "
          import os, zipfile
          with zipfile.ZipFile('dfzygisk.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk('pkg'):
                  for f in files:
                      p = os.path.join(root, f)
                      arc = os.path.relpath(p, 'pkg')
                      z.write(p, arc)
                      print('add', arc)
          "
          ls -la dfzygisk.zip
          python3 -c "
          import zipfile
          for i in zipfile.ZipFile('dfzygisk.zip').infolist():
              print(i.filename, i.file_size)
          "

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dfzygisk-module
          path: |
            dfzygisk.zip
            build/libzygisk.so
          if-no-files-found: warn

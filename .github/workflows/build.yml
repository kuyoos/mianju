name: Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile (log to file, never fail early)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK_VER=26.1.10909125
          {
            echo "SDK=$SDK"
            if [ ! -d "$SDK/ndk/$NDK_VER" ]; then
              yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VER" 2>&1 | tail -5
            fi
          } 2>&1 | tee build.log

          export ANDROID_NDK_HOME="$SDK/ndk/$NDK_VER"
          echo "NDK=$ANDROID_NDK_HOME" | tee -a build.log
          ls "$ANDROID_NDK_HOME" 2>&1 | tee -a build.log

          echo "=== CONFIGURE ===" | tee -a build.log
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee -a build.log
          echo "configure_rc=$?" | tee -a build.log

          echo "=== BUILD ===" | tee -a build.log
          cmake --build build -j4 2>&1 | tee -a build.log
          echo "build_rc=$?" | tee -a build.log

          echo "=== RESULT ===" | tee -a build.log
          find . -name "*.so" 2>&1 | tee -a build.log
          ls -la build 2>&1 | tee -a build.log
        continue-on-error: true

      - name: Upload log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: error

      - name: Upload so
        uses: actions/upload-artifact@v4
        with:
          name: lib
          path: build/libzygisk.so
          if-no-files-found: warn

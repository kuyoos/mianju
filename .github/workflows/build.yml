name: Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK_VER=26.1.10909125
          if [ ! -d "$SDK/ndk/$NDK_VER" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VER" >/dev/null 2>&1
          fi
          export ANDROID_NDK_HOME="$SDK/ndk/$NDK_VER"

          echo "NDK dir contents:"
          ls "$ANDROID_NDK_HOME" || { echo "::error::NDK not found at $ANDROID_NDK_HOME"; exit 1; }

          echo "toolchain file:"
          ls "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" || { echo "::error::toolchain missing"; exit 1; }

          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DCMAKE_BUILD_TYPE=Release > cfg.log 2>&1 || true
          echo "--- configure output ---"
          cat cfg.log
          if [ ! -f build/Makefile ] && [ ! -f build/build.ninja ]; then
            echo "::error::cmake configure failed"
            tail -30 cfg.log | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

          cmake --build build -j4 > bld.log 2>&1 || true
          echo "--- build output ---"
          cat bld.log
          if [ ! -f build/libzygisk.so ]; then
            echo "::error::libzygisk.so not produced"
            tail -30 bld.log | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          ls -la build/libzygisk.so

      - name: Package
        run: |
          mkdir -p pkg/lib64
          cp magisk/module.prop magisk/post-fs-data.sh magisk/service.sh pkg/
          cp build/libzygisk.so pkg/lib64/libzygisk.so
          python3 -c "
          import os, zipfile
          with zipfile.ZipFile('dfzygisk.zip','w',zipfile.ZIP_DEFLATED) as z:
              for root,d,files in os.walk('pkg'):
                  for f in files:
                      p=os.path.join(root,f)
                      z.write(p, os.path.relpath(p,'pkg'))
                      print('add', os.path.relpath(p,'pkg'))
          "
          ls -la dfzygisk.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dfzygisk
          path: dfzygisk.zip

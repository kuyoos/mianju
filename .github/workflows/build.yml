name: Build Zygisk Module

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          set -x
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK_VER=26.1.10909125
          if [ ! -d "$SDK/ndk/$NDK_VER" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VER" > /dev/null 2>&1
          fi
          export ANDROID_NDK_HOME="$SDK/ndk/$NDK_VER"
          cmake -B build -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DCMAKE_BUILD_TYPE=Release -DANDROID_STL=c++_static
          cmake --build build -j4
          ls -la build/

      - name: Package
        run: |
          set -x
          mkdir -p pkg/lib64
          cp magisk/module.prop magisk/post-fs-data.sh magisk/service.sh pkg/
          cp build/libzygisk.so pkg/lib64/libzygisk.so
          cd pkg && python3 -c "
          import os, zipfile
          z = zipfile.ZipFile('/tmp/dfzygisk.zip','w',zipfile.ZIP_DEFLATED)
          for root,d,files in os.walk('.'):
              for f in files:
                  p=os.path.join(root,f)
                  z.write(p, os.path.relpath(p,'.'))
          z.close()
          "
          cp /tmp/dfzygisk.zip ../dfzygisk.zip
          ls -la ../dfzygisk.zip

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dfzygisk
          path: |
            dfzygisk.zip
            build/libzygisk.so
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          if-no-files-found: warn
